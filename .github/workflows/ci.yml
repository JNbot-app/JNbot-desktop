name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      # The mobile client contract check compares against the sibling checkout.
      - uses: actions/checkout@v5
        with:
          repository: JNbot-app/JNbot-mobile
          path: jnbot-mobile
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Generated files are up to date
        working-directory: app
        run: |
          node scripts/build-jnbot-types.mjs --check
          npm run check:mobile-client-contract
      - run: npx jest
        working-directory: app
