name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      # The mobile client contract check compares against the sibling checkout,
      # which is only readable once JNbot-mobile is public.
      - uses: actions/checkout@v5
        id: mobile
        continue-on-error: true
        with:
          repository: JNbot-app/JNbot-mobile
          path: jnbot-mobile
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
      - run: npm install
        working-directory: app
      - name: Plugin reference is up to date
        working-directory: app
        run: node scripts/build-jnbot-types.mjs --check
      - name: Mobile client contract is up to date
        if: steps.mobile.outcome == 'success'
        working-directory: app
        run: npm run check:mobile-client-contract
      - run: npx jest
        working-directory: app
