apply plugin: 'com.android.library'

android {
    namespace 'com.jnbot.needle'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk {
            // Match Node.js Mobile: its packaged runtime does not include x86.
            abiFilters = project(':app').android.defaultConfig.ndk.abiFilters ?: ['armeabi-v7a', 'x86_64', 'arm64-v8a']
        }
        externalNativeBuild {
            cmake {
                arguments "-DNODE_MOBILE_DIR=${rootProject.projectDir}/../node_modules/nodejs-mobile-react-native"
                cppFlags '-std=c++17 -fexceptions'
            }
        }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
}

dependencies { implementation 'com.facebook.react:react-android' }
